<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer de Linux - INACAP</title>
    <style>
        :root {
            --bg-color: #fdfcf0; /* Tono crema muy suave */
            --card-bg: #ffffff;
            --primary-pastel: #ffcfd2; /* Rosa pastel */
            --secondary-pastel: #cfdbd5; /* Gris verdoso pastel */
            --accent-pastel: #e8dff5; /* Lavanda pastel */
            --text-color: #444444;
            --correct: #d0f4de;
            --incorrect: #fce1e4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
            max-width: 650px;
            width: 100%;
            text-align: center;
            border: 1px solid #f0ead6;
        }

        h1 { color: #555b6e; font-size: 1.6rem; margin-bottom: 5px; }
        .subtitle { color: #89b0ae; font-weight: bold; margin-bottom: 20px; display: block; }
        .footer-tag { font-size: 0.85rem; color: #a8dadc; margin-top: 25px; border-top: 1px dashed #eee; padding-top: 10px; }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            background: #faf9f6;
            padding: 10px;
            border-radius: 15px;
        }

        .question-box {
            margin-bottom: 30px;
            font-size: 1.2rem;
            line-height: 1.4;
            color: #555b6e;
        }

        .options-grid {
            display: grid;
            gap: 15px;
        }

        button.option {
            background-color: #fff;
            border: 2px solid var(--accent-pastel);
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            color: var(--text-color);
        }

        button.option:hover {
            background-color: var(--accent-pastel);
            transform: scale(1.02);
        }

        .correct { background-color: var(--correct) !important; border-color: #a7d7bc !important; font-weight: bold; }
        .incorrect { background-color: var(--incorrect) !important; border-color: #e5b3b7 !important; }

        #next-btn {
            margin-top: 25px;
            padding: 12px 30px;
            border-radius: 50px;
            border: none;
            background-color: #bee1e6;
            color: #555b6e;
            font-weight: bold;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        #next-btn:hover { background-color: #a9d6e5; }
    </style>
</head>
<body>

    <div class="container">
        <h1> Desafío Linux</h1>
        <span class="subtitle">INACAP 2026</span>
        
        <div class="stats">
            <span>Progreso: <span id="current-q">0</span>/10</span>
            <span>Aciertos: <span id="score">0</span></span>
        </div>

        <div id="quiz-area">
            <div class="question-box" id="question">Preparando el sistema...</div>
            <div class="options-grid" id="options"></div>
            <button id="next-btn" onclick="nextQuestion()">Continuar ➔</button>
        </div>

        <div class="footer-tag">Docente NMZ - versión 1 - 2026<br>INACAP</div>
    </div>

    <script>
        const rawData = [
            { q: "¿Qué función principal cumple un sistema operativo?", a: "Administrar los recursos del hardware y permitir la ejecución de aplicaciones" },
            { q: "¿Qué es una distribución Linux?", a: "Una versión del sistema operativo Linux con herramientas y configuraciones específicas" },
            { q: "¿Por qué es importante revisar los requisitos de hardware antes de instalar un sistema operativo?", a: "Para asegurar compatibilidad y buen rendimiento del sistema" },
            { q: "¿Qué ventaja tiene Linux en servidores?", a: "Alta estabilidad y seguridad" },
            { q: "¿Qué es una partición en Linux?", a: "Una división lógica de un disco duro" },
            { q: "¿Cuál es una ventaja de crear varias particiones?", a: "Permite organizar y aislar la información" },
            { q: "¿Qué característica tiene GPT frente a MBR?", a: "Permite más particiones y discos más grandes" },
            { q: "¿Qué comando se utiliza para crear particiones?", a: "fdisk" },
            { q: "¿Por qué se debe formatear una partición?", a: "Para definir el sistema de archivos" },
            { q: "¿Qué sistema de archivos es común en Linux?", a: "ext4" },
            { q: "¿Qué es la partición swap?", a: "Espacio en disco usado como memoria virtual" },
            { q: "¿Qué es el usuario root?", a: "Usuario administrador con control total" },
            { q: "¿Qué comando crea un usuario en Linux?", a: "useradd" },
            { q: "¿Dónde se almacena la información de usuarios?", a: "/etc/passwd" },
            { q: "¿Qué es el UID?", a: "Identificador único de usuario" },
            { q: "¿Por qué son importantes los permisos en Linux?", a: "Para controlar el acceso a archivos y seguridad" },
            { q: "¿Qué comando elimina un usuario?", a: "userdel" },
            { q: "¿Qué es una ruta absoluta?", a: "Ruta que inicia desde la raíz del sistema" },
            { q: "¿Qué comando crea un directorio?", a: "mkdir" },
            { q: "¿Qué comando lista archivos?", a: "ls" },
            { q: "¿Qué hace el comando mv?", a: "Mueve o renombra archivos" },
            { q: "¿Qué hace chmod?", a: "Modifica permisos de archivos o directorios" },
            { q: "¿Qué significa el permiso 'r'?", a: "Leer" },
            { q: "¿Qué archivo permite montar particiones automáticamente?", a: "/etc/fstab" },
            { q: "¿Qué comando cuenta las líneas de un archivo?", a: "wc -l" },
            { q: "¿Qué comando muestra la ruta del directorio actual?", a: "pwd" },
            { q: "¿Qué comando se usa para formatear una partición como ext4?", a: "mkfs.ext4 /dev/sdb1" },
            { q: "¿Qué comando se usa para montar una partición?", a: "mount /dev/sdb1 /datos" },
            { q: "¿Qué comando busca un archivo por nombre desde la raíz?", a: "find / -name config.txt" },
            { q: "¿Cuál es la función del comando rm?", a: "Eliminar archivos o directorios" },
            { q: "¿Qué comando se usa para visualizar el contenido de un archivo sin editarlo?", a: "cat" },
            { q: "¿Qué herramienta se usa comúnmente para editar archivos de texto en terminal?", a: "nano" },
            { q: "¿Qué comando permite buscar patrones de texto dentro de archivos?", a: "grep" }
        ];

        let questions = [];
        let currentIndex = 0;
        let score = 0;
        const totalPerSession = 10;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function initQuiz() {
            questions = shuffle([...rawData]).slice(0, totalPerSession);
            currentIndex = 0;
            score = 0;
            updateStats();
            showQuestion();
        }

        function showQuestion() {
            const qData = questions[currentIndex];
            document.getElementById('question').innerText = qData.q;
            document.getElementById('next-btn').style.display = 'none';
            
            let options = [qData.a];
            while(options.length < 4) {
                let randomA = rawData[Math.floor(Math.random() * rawData.length)].a;
                if(!options.includes(randomA)) options.push(randomA);
            }
            
            shuffle(options);
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.classList.add('option');
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt, qData.a);
                optionsDiv.appendChild(btn);
            });
        }

        function checkAnswer(btn, selected, correct) {
            const allBtns = document.querySelectorAll('.option');
            allBtns.forEach(b => b.disabled = true);

            if(selected === correct) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('incorrect');
                allBtns.forEach(b => {
                    if(b.innerText === correct) b.classList.add('correct');
                });
            }
            updateStats();
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            if(currentIndex < totalPerSession) {
                showQuestion();
            } else {
                showFinalResult();
            }
        }

        function showFinalResult() {
            const area = document.getElementById('quiz-area');
            let message = score >= 7 ? "¡Excelente trabajo!" : "¡Sigue practicando!";
            area.innerHTML = `
                <div style="font-size: 4rem; margin-bottom: 10px;"></div>
                <h2>${message}</h2>
                <p style="font-size: 1.2rem;">Lograste <strong>${score}</strong> aciertos de ${totalPerSession}</p>
                <button onclick="location.reload()" class="option" style="margin-top:20px; width:100%">Reiniciar Entrenamiento</button>
            `;
        }

        function updateStats() {
            document.getElementById('current-q').innerText = currentIndex + (currentIndex < totalPerSession ? 1 : 0);
            document.getElementById('score').innerText = score;
        }

        initQuiz();
    </script>
</body>
</html>
