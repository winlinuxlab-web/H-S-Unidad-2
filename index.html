<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer de Linux - INACAP</title>
    <style>
        :root {
            --bg-color: #fdfcf0; /* Tono crema muy suave */
            --card-bg: #ffffff;
            --primary-pastel: #ffcfd2; /* Rosa pastel */
            --secondary-pastel: #cfdbd5; /* Gris verdoso pastel */
            --accent-pastel: #e8dff5; /* Lavanda pastel */
            --text-color: #444444;
            --correct: #d0f4de;
            --incorrect: #fce1e4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
            max-width: 650px;
            width: 100%;
            text-align: center;
            border: 1px solid #f0ead6;
        }

        h1 { color: #555b6e; font-size: 1.6rem; margin-bottom: 5px; }
        .subtitle { color: #89b0ae; font-weight: bold; margin-bottom: 20px; display: block; }
        .footer-tag { font-size: 0.85rem; color: #a8dadc; margin-top: 25px; border-top: 1px dashed #eee; padding-top: 10px; }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            background: #faf9f6;
            padding: 10px;
            border-radius: 15px;
        }

        .question-box {
            margin-bottom: 30px;
            font-size: 1.2rem;
            line-height: 1.4;
            color: #555b6e;
        }

        .options-grid {
            display: grid;
            gap: 15px;
        }

        button.option {
            background-color: #fff;
            border: 2px solid var(--accent-pastel);
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            color: var(--text-color);
        }

        button.option:hover {
            background-color: var(--accent-pastel);
            transform: scale(1.02);
        }

        .correct { background-color: var(--correct) !important; border-color: #a7d7bc !important; font-weight: bold; }
        .incorrect { background-color: var(--incorrect) !important; border-color: #e5b3b7 !important; }

        #next-btn {
            margin-top: 25px;
            padding: 12px 30px;
            border-radius: 50px;
            border: none;
            background-color: #bee1e6;
            color: #555b6e;
            font-weight: bold;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        #next-btn:hover { background-color: #a9d6e5; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🐧 Desafío Linux</h1>
        <span class="subtitle">INACAP 2026</span>
        
        <div class="stats">
            <span>Progreso: <span id="current-q">0</span>/10</span>
            <span>Aciertos: <span id="score">0</span></span>
        </div>

        <div id="quiz-area">
            <div class="question-box" id="question">Preparando el sistema...</div>
            <div class="options-grid" id="options"></div>
            <button id="next-btn" onclick="nextQuestion()">Continuar ➔</button>
        </div>

        <div class="footer-tag">Docente NMZ - versión 1 - 2026<br>Soporte Académico INACAP</div>
    </div>
